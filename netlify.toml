[build]
  command = "npm install"

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "netlify/functions/system-prompt.txt"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."generate-plan"]
  timeout = 26

[functions."generate-plan-background"]
  timeout = 900
  background = true

[functions."optimize-plan-background"]
  timeout = 900
  background = true

[functions."generate-cover-art"]
  timeout = 30

[functions."generate-cover-art-background"]
  timeout = 900
  background = true

[functions."generate-export"]
  timeout = 90
  included_files = ["netlify/functions/export/cover-images/*.png"]

[functions."generate-xlsx"]
  timeout = 30

[[redirects]]
  from = "/"
  to = "/home.html"
  status = 302
