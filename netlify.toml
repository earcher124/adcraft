[build]
  command = "npm install"

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "netlify/functions/system-prompt.txt"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."generate-plan"]
  timeout = 26

[functions."generate-plan-background"]
  timeout = 900
  type = "background"

[[redirects]]
  from = "/"
  to = "/home.html"
  status = 302
