  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #FAF6ED;
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .logo {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 32px;
      font-weight: 700;
      color: #4A1040;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
      text-align: center;
    }
    .tagline {
      font-size: 14px;
      color: #6b6270;
      margin-bottom: 40px;
      text-align: center;
    }
    #clerk-mount {
      width: 100%;
      max-width: 400px;
    }
  </style>
</head>
<body>
  <div class="logo">AdCraft</div>
  <p class="tagline">AI-powered advertising plans</p>
  <div id="clerk-mount"></div>

  <script src="_shared.js"></script>
  <script>
    window.__clerkLoaded.then(function(clerk) {
      if (clerk.user) {
        window.location.href = "/dashboard.html";
        return;
      }

      var mount = document.getElementById("clerk-mount");
      // Clerk appends __clerk_status=sign_up when routing to sign-up URL
      var params = new URLSearchParams(window.location.search);
      var isSignUp = params.get("__clerk_status") === "sign_up" || window.location.hash === "#signup";

      if (isSignUp) {
        clerk.mountSignUp(mount, {
          fallbackRedirectUrl: "/dashboard.html",
          signInUrl: "/login.html"
        });
      } else {
        clerk.mountSignIn(mount, {
          fallbackRedirectUrl: "/dashboard.html",
          signUpUrl: "/login.html#signup",
          signUpFallbackRedirectUrl: "/dashboard.html"
        });
      }
    });
  </script>
</body>
</html>
